name: Sunucu kontrol
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Uyandır
        run: curl -s -m 90 https://descent-server.onrender.com/health || true
      - name: Oda listesi (/rooms) yayında mı
        run: |
          for i in 1 2 3; do r=$(curl -s -m 60 https://descent-server.onrender.com/rooms || true); echo "$r" | head -c 300; echo; echo "$r" | grep -q '"rooms"' && exit 0; sleep 20; done; exit 1
